services:
  - type: web
    name: pdfshield
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PDFSHIELD_USE_MANAGED_DB
        value: "false"
      - key: PDFSHIELD_MAX_UPLOAD_MB
        value: "25"
      - key: CORS_ORIGINS
        sync: false
